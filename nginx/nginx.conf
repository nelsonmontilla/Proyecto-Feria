server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para optimizar rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Carpeta raíz donde se sirve el build de React (Vite dist)
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router (Single Page Application fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché de archivos estáticos e imágenes
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Reverse Proxy hacia el Backend propio en Node.js / Express
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
